[project]
name = "deploy-agent"
version = "0.1.0"
description = "DeepAgents deployment agent demo"
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "deepagents==0.4.12",
    "fastapi[standard]>=0.135.2",
    "langchain-core==1.4.0",
    "langchain-openai==1.2.1",
    "pydantic-settings>=2.13.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "uvicorn>=0.42.0",
    "paramiko>=3.5.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
